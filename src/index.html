  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

  <link rel="apple-touch-icon" href="favicon-192.png">
  <!-- Dark unless you picked Light or Auto with the theme button; runs first so there's no flash. -->
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('mm-theme') || 'dark'; } catch (e) {}
      if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
